<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{{ PRODUCT_NAME }}}</title>
    <style>
      html, body { height: 100%; margin: 0; background: #000; overflow: hidden; }
      body { display: flex; align-items: center; justify-content: center; }
      /* Largest 16:9 area that fits the window, so the layout matches the desktop builds. */
      #canvas { display: block; width: min(100vw, calc(100vh * 16 / 9)); aspect-ratio: 16 / 9; outline: none; }
      #progress { position: fixed; left: 25%; right: 25%; top: 50%; height: 4px; background: #333; }
      #progress div { height: 100%; width: 0; background: #fff; }
      #message { position: fixed; left: 16px; right: 16px; top: 16px; color: #fff; font: 16px sans-serif; text-align: center; }
    </style>
  </head>
  <body>
    <canvas id="canvas" tabindex="-1"></canvas>
    <div id="progress"><div></div></div>
    <div id="message" role="status"></div>
    <script src="Build/{{{ LOADER_FILENAME }}}"></script>
    <script>
      const canvas = document.getElementById("canvas");
      const progress = document.getElementById("progress");
      const message = document.getElementById("message");

      function showMessage(text, type) {
        if (type === "error" || type === "warning") message.textContent = text;
        else console.log(text);
      }

      createUnityInstance(canvas, {
        dataUrl: "Build/{{{ DATA_FILENAME }}}",
        frameworkUrl: "Build/{{{ FRAMEWORK_FILENAME }}}",
        codeUrl: "Build/{{{ CODE_FILENAME }}}",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "{{{ COMPANY_NAME }}}",
        productName: "{{{ PRODUCT_NAME }}}",
        productVersion: "{{{ PRODUCT_VERSION }}}",
        showBanner: showMessage
      }, value => {
        progress.firstElementChild.style.width = value * 100 + "%";
      }).then(() => {
        progress.remove();
        canvas.focus();
      }).catch(error => {
        progress.remove();
        message.textContent = error;
      });
    </script>
  </body>
</html>
